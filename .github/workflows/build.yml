name: Build DLL

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: i686-pc-windows-msvc
            arch: x86

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build DLL (Debug)
        run: cargo build --target ${{ matrix.target }}

      - name: Build DLL (Release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Debug
        run: Compress-Archive -Path target/${{ matrix.target }}/debug/coldloader.dll, coldloader.EXAMPLE.ini -DestinationPath coldloader-debug-${{ matrix.arch }}.zip

      - name: Package Release
        run: Compress-Archive -Path target/${{ matrix.target }}/release/coldloader.dll, coldloader.EXAMPLE.ini -DestinationPath coldloader-release-${{ matrix.arch }}.zip

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            coldloader-debug-${{ matrix.arch }}.zip
            coldloader-release-${{ matrix.arch }}.zip
